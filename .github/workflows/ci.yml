name: CI

# Added 2026-09-12 during the full-project audit. Until now the only workflow
# in this repo was the gitleaks secret scan: typecheck, lint and the Vitest
# suite ran only on a developer's machine, so a red build could be merged and
# deployed without anything failing. The security suites in src/__tests__ are
# regression guards — they are only guards if CI runs them on every push.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint

      # --pool=threads avoids a fork-pool worker-startup flake seen in
      # sandboxed environments; see CLAUDE.md.
      - name: Unit and security tests
        run: npx vitest run --pool=threads
