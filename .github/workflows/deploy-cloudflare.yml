name: Deploy · Cloudflare (Neon)

# Step 16 of the Cloudflare + Neon migration (docs/claude/MIGRATION_EXECUTION.md).
# Deploys the Workers build from GitHub: from the owner's PC the ~35 MB Worker
# upload runs at ~60 KB/s and times out (docs/claude/MIGRATION_PROGRESS.md,
# step 16). Runs on the Neon branch only — production (Vercel + Supabase)
# deploys from main and is not touched.
#
# The `cloudflare` environment accepts only this branch and holds
# CLOUDFLARE_API_TOKEN (secret) plus CLOUDFLARE_ACCOUNT_ID and APP_URL
# (variables). Runtime secrets (auth, AI keys, signing secrets) live on the
# Worker itself (`wrangler secret bulk`), never in GitHub.

on:
  push:
    branches: [migrate/04-better-auth]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: build · deploy Worker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: cloudflare
      url: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build (OpenNext)
        env:
          # Inlined at build time: invitation and password-reset links use it.
          NEXT_PUBLIC_APP_URL: ${{ vars.APP_URL }}
        run: |
          test -n "$NEXT_PUBLIC_APP_URL" || { echo "APP_URL is not set on the cloudflare environment"; exit 1; }
          npm run cf:build

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          # Only for wrangler's local proxy step during deploy (never connected);
          # the Worker reaches Neon through its Hyperdrive bindings.
          CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: postgres://ci:ci@127.0.0.1:5432/ci
          CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE_AUTH: postgres://ci:ci@127.0.0.1:5432/ci
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is not set on the cloudflare environment"; exit 1; }
          npm run cf:deploy
