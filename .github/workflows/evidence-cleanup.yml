# Permanently deletes proctoring evidence snapshots older than 30 hours
# (policy: src/lib/evidence-keys.ts). Runs every hour, so a snapshot is gone
# within 30–31 hours; the evidence bucket's own lifecycle rule (2 days) is a
# backstop if this job ever stops. Viewing is already cut off at exactly 30
# hours by /api/proctor/evidence, independently of this job.
#
# Repository secrets required:
#   APP_URL      the production origin, e.g. https://eduquest-v2.vercel.app
#   CRON_SECRET  same value as the CRON_SECRET env var of the deployment
name: Evidence cleanup

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete snapshots older than 30 hours
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL or CRON_SECRET not set; nothing to do."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 60 \
            -X POST "$APP_URL/api/proctor/evidence/cleanup" \
            -H "Authorization: Bearer $CRON_SECRET"
