name: Secret scan

# Added 2026-09-07 after gitleaks found a production Postgres password
# hardcoded in scripts/run-migration.mjs and committed to a PUBLIC repo on
# 2026-06-22 — undetected for ~2.5 months. This job exists so that class of
# mistake fails the pipeline instead of shipping silently.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history — a secret added in an old commit and later deleted
          # from the working tree is still exposed and must still fail.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # No GITLEAKS_LICENSE set: the action is free for public repos.
        # If this repo is later made private, a license key is required —
        # see https://github.com/gitleaks/gitleaks-action#-license
